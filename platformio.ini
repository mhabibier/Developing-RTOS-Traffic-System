; ============================================================
; platformio.ini — Adaptive Smart Traffic Light (ESP32)
; FreeRTOS + Percepio TraceRecorder (Tracealyzer)
; ============================================================
; Catatan Tracealyzer pada Wokwi:
;   - RTT (SEGGER J-Link) TIDAK didukung Wokwi karena tidak ada JTAG.
;   - Gunakan mode STREAMING via UART (Serial) atau SNAPSHOT (in-RAM).
;   - Konfigurasi: TRC_CFG_RECORDER_MODE = TRC_RECORDER_MODE_STREAMING
;     dengan TRC_CFG_STREAM_PORT = TRC_STREAM_PORT_SERIAL_UART
;   - File trcConfig.h dan trcStreamingConfig.h wajib ada di src/
;     (copy dari library TraceRecorder dan sesuaikan).
;   - Baud rate streaming diset 115200 (sama dengan monitor_speed).
;   - Untuk Wokwi, serial stream data akan keluar di terminal; Tracealyzer
;     desktop app dapat di-connect via "Serial Stream" (COM port / pipe).
; ============================================================

[env:esp32dev]
platform   = espressif32
board      = esp32dev
framework  = arduino

; ── Monitor ────────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ── Upload ─────────────────────────────────────────────────
upload_speed = 921600

; ── Dependencies ───────────────────────────────────────────
lib_deps =
    ; LCD I2C 16x2 (PCF8574 backpack)
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

    ; Percepio TraceRecorder (Tracealyzer)
    ; Versi 4.x mendukung ESP32 FreeRTOS (IDF + Arduino wrapper)
    ; Sumber resmi: https://github.com/percepio/TraceRecorderSource
    ; Jika belum ada di registry, gunakan path lokal:
    ;   ${PROJECTDIR}/lib/TraceRecorder
    ; atau uncomment baris berikut (GitHub):
    https://github.com/percepio/TraceRecorderSource.git#v4.9.2

; ── Build Flags ────────────────────────────────────────────
build_flags =
    ; ── Multicore: gunakan kedua core ESP32 ─────────────────
    -D ARDUINO_RUNNING_CORE=1
    ; Pastikan unicore TIDAK aktif (dual-core default di esp32dev)
    ; -D CONFIG_FREERTOS_UNICORE=0   ; sudah default di sdkconfig

    ; ── FreeRTOS Trace Facility ──────────────────────────────
    ; Aktifkan trace hooks di FreeRTOS kernel (wajib untuk TraceRecorder)
    -D configUSE_TRACE_FACILITY=1
    -D configGENERATE_RUN_TIME_STATS=1
    -D configUSE_STATS_FORMATTING_FUNCTIONS=1

    ; ── TraceRecorder mode: Streaming via UART ───────────────
    ; TRC_RECORDER_MODE_STREAMING = 2
    ; TRC_RECORDER_MODE_SNAPSHOT  = 1
    -D TRC_CFG_RECORDER_MODE=2

    ; ── Stack overflow detection (canary) ────────────────────
    -D configCHECK_FOR_STACK_OVERFLOW=2

    ; ── Priority ceiling untuk mutex (priority inheritance) ──
    -D configUSE_MUTEXES=1
    -D configUSE_RECURSIVE_MUTEXES=1

    ; ── Tick rate (default 1000 Hz = 1 ms per tick) ──────────
    ; Jika perlu lebih presisi, bisa naikkan ke 10000:
    ; -D configTICK_RATE_HZ=10000

    ; ── Enable portYIELD_FROM_ISR SMP-safe ───────────────────
    -D configNUM_CORES=2

; ── Build Type ─────────────────────────────────────────────
build_type = debug

; ── Partition Table ────────────────────────────────────────
; Gunakan tabel default (single_factory_no_ota) atau custom
; board_build.partitions = partitions.csv

; ── Extra Scripts ──────────────────────────────────────────
; extra_scripts = pre:scripts/gen_trace_header.py
